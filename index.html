<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Student Registration System</h1>
        <p>A simple platform to manage student records efficiently.</p>
    </header>

    <div class="container">
        <section class="form-section">
            <h2>Register Student</h2>
            <form id="studentForm">
                <input type="hidden" id="editIndex"> <div class="form-group">
                    <label for="studentName">Student Name:</label>
                    <input type="text" id="studentName" placeholder="Enter name" required>
                </div>

                <div class="form-group">
                    <label for="studentID">Student ID:</label>
                    <input type="number" id="studentID" placeholder="Enter ID" required>
                </div>

                <div class="form-group">
                    <label for="emailID">Email ID:</label>
                    <input type="email" id="emailID" placeholder="Enter email" required>
                </div>

                <div class="form-group">
                    <label for="contactNo">Contact No:</label>
                    <input type="number" id="contactNo" placeholder="Enter contact number" required>
                </div>

                <button type="submit" id="submitBtn">Add Student</button>
            </form>
        </section>

        <section class="display-section">
            <h2>Registered Students</h2>
            <div class="table-container" id="tableContainer">
                <table>
                    <thead>
                        <tr>
                            <th>Student Name</th>
                            <th>Student ID</th>
                            <th>Email ID</th>
                            <th>Contact No</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="studentTableBody">
                        </tbody>
                </table>
            </div>
        </section>
    </div>

</body>
</html>
