<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NextGen Student Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="font-['Rajdhani'] text-gray-100 min-h-screen flex flex-col items-center p-4 relative overflow-x-hidden bg-gray-950">

    <div class="fixed inset-0 -z-10">
        <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-blue-900/20 via-gray-950 to-gray-950"></div>
        <div class="absolute top-0 left-0 w-full h-full bg-[url('https://www.transparenttextures.com/patterns/circuit-board.png')] opacity-10 animate-pan-slow"></div>
    </div>

    <div id="notification-area" class="fixed top-5 right-5 z-50 flex flex-col gap-3"></div>

    <header class="w-full max-w-6xl mb-8 mt-4 animate-fade-in-down">
        <div class="cyber-panel p-6 rounded-2xl flex items-center justify-between relative overflow-hidden">
            <div class="absolute inset-0 bg-gradient-to-r from-cyan-500/10 to-purple-500/10 animate-pulse-slow"></div>
            <div class="flex items-center gap-4 relative z-10">
                <div class="w-14 h-14 bg-gradient-to-br from-cyan-400 to-blue-600 rounded-xl flex items-center justify-center shadow-lg shadow-cyan-500/30">
                    <i class="fas fa-rocket text-3xl text-white"></i>
                </div>
                <div>
                    <h1 class="font-['Orbitron'] text-3xl font-bold tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-blue-400 to-purple-400">NEXTGEN PORTAL</h1>
                    <p class="text-sm text-cyan-300/70 tracking-[0.3em] uppercase font-medium">Advanced Student Data System</p>
                </div>
            </div>
            <div id="totalCount" class="hidden md:block font-['Orbitron'] bg-gray-900/50 border border-cyan-500/30 px-5 py-3 rounded-xl text-cyan-300 relative z-10 shadow-sm shadow-cyan-500/20">
                Total Students: <span id="countValue" class="text-white font-bold text-lg ml-1">0</span>
            </div>
        </div>
    </header>

    <main class="w-full max-w-6xl flex flex-col lg:flex-row gap-8 relative z-10">
        
        <section class="w-full lg:w-2/5 animate-slide-in-left">
            <div class="cyber-panel p-8 rounded-2xl relative overflow-hidden group">
                <h2 class="font-['Orbitron'] text-xl mb-8 flex items-center gap-3 text-cyan-400 border-b border-cyan-500/20 pb-4">
                    <i class="fas fa-user-plus"></i> New Entry Module
                </h2>
                
                <form id="studentForm" class="flex flex-col gap-6">
                    <input type="hidden" id="editIndex" value="-1">

                    <div class="input-group">
                        <label class="text-xs uppercase tracking-wider text-cyan-300/70 mb-2 block font-bold ml-1">Full Name (Alphabets Only, 3 Words)</label>
                        <div class="relative">
                            <i class="fas fa-user absolute left-4 top-1/2 -translate-y-1/2 text-cyan-500/50"></i>
                            <input type="text" id="name" class="cyber-input pl-10" placeholder="First Middle Last">
                        </div>
                    </div>

                    <div class="input-group">
                        <label class="text-xs uppercase tracking-wider text-cyan-300/70 mb-2 block font-bold ml-1">Student ID (Numbers Only)</label>
                        <div class="relative">
                            <i class="fas fa-id-card absolute left-4 top-1/2 -translate-y-1/2 text-cyan-500/50"></i>
                            <input type="text" id="studentId" class="cyber-input pl-10" placeholder="e.g. 2025001">
                        </div>
                    </div>

                    <div class="input-group">
                        <label class="text-xs uppercase tracking-wider text-cyan-300/70 mb-2 block font-bold ml-1">Email ID</label>
                        <div class="relative">
                            <i class="fas fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-cyan-500/50"></i>
                            <input type="email" id="email" class="cyber-input pl-10" placeholder="student@nextgen.com">
                        </div>
                    </div>

                    <div class="input-group">
                        <label class="text-xs uppercase tracking-wider text-cyan-300/70 mb-2 block font-bold ml-1">Contact (10 Digits Only)</label>
                        <div class="relative">
                            <i class="fas fa-phone absolute left-4 top-1/2 -translate-y-1/2 text-cyan-500/50"></i>
                            <input type="text" id="contact" class="cyber-input pl-10" placeholder="9876543210">
                        </div>
                    </div>

                    <div class="input-group">
                        <label class="text-xs uppercase tracking-wider text-cyan-300/70 mb-2 block font-bold ml-1">Discipline</label>
                        <div class="relative">
                            <i class="fas fa-graduation-cap absolute left-4 top-1/2 -translate-y-1/2 text-cyan-500/50"></i>
                            <select id="course" class="cyber-input pl-10 appearance-none cursor-pointer">
                                <option value="" class="bg-gray-900">Select Stream</option>
                                <option value="Computer Sci" class="bg-gray-900">Computer Science</option>
                                <option value="Mech Eng" class="bg-gray-900">Mechanical Eng</option>
                                <option value="AI & Data" class="bg-gray-900">AI & Data Science</option>
                                <option value="Cybersec" class="bg-gray-900">Cybersecurity</option>
                            </select>
                            <i class="fas fa-chevron-down absolute right-4 top-1/2 -translate-y-1/2 text-cyan-500/50 pointer-events-none"></i>
                        </div>
                    </div>

                    <button type="submit" id="submitBtn" class="mt-6 cyber-button relative w-full py-4 rounded-xl font-['Orbitron'] font-bold tracking-widest overflow-hidden group text-lg shadow-lg shadow-cyan-500/20 transition-all duration-300 hover:shadow-cyan-500/40 hover:scale-[1.02]">
                        <span class="relative z-10 flex items-center justify-center gap-3">
                            <i class="fas fa-plus"></i> INITIALIZE
                        </span>
                        <div class="absolute inset-0 bg-gradient-to-r from-cyan-600 to-blue-600 opacity-80 group-hover:opacity-100 transition duration-300"></div>
                        <div class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition duration-500 ease-out blur-md"></div>
                    </button>
                </form>
            </div>
        </section>

        <section class="w-full lg:w-3/5 animate-slide-in-right">
            <div class="cyber-panel p-1 rounded-2xl h-full flex flex-col relative overflow-hidden">
                <div class="p-6 pb-4 border-b border-cyan-500/20 flex justify-between items-center bg-gray-900/50">
                    <h2 class="font-['Orbitron'] text-xl text-cyan-400 flex items-center gap-3">
                        <i class="fas fa-database"></i> Student Database
                    </h2>
                    <div class="flex gap-2">
                         <div class="w-3 h-3 rounded-full bg-red-500 animate-pulse shadow-sm shadow-red-500/50"></div>
                         <div class="w-3 h-3 rounded-full bg-yellow-500 animate-pulse delay-75 shadow-sm shadow-yellow-500/50"></div>
                         <div class="w-3 h-3 rounded-full bg-green-500 animate-pulse delay-150 shadow-sm shadow-green-500/50"></div>
                    </div>
                </div>

                <div class="overflow-auto max-h-[650px] p-4 custom-scrollbar flex-grow">
                    <table class="w-full text-left border-separate border-spacing-y-3">
                        <thead class="sticky top-0 z-20">
                            <tr class="text-xs uppercase tracking-wider text-cyan-300/70 bg-gray-900/95 backdrop-blur-xl shadow-sm shadow-black/20">
                                <th class="p-4 rounded-l-xl font-bold">Profile</th>
                                <th class="p-4 font-bold">ID & Contact</th>
                                <th class="p-4 font-bold">Course</th>
                                <th class="p-4 rounded-r-xl text-center font-bold">Controls</th>
                            </tr>
                        </thead>
                        <tbody id="studentTableBody">
                            </tbody>
                    </table>

                    <div id="emptyMsg" class="hidden flex flex-col items-center justify-center py-24 text-cyan-500/40 opacity-70">
                        <i class="fas fa-microchip text-7xl mb-6 animate-pulse-slow"></i>
                        <p class="font-['Orbitron'] text-lg tracking-widest">NO DATA FRAGMENTS FOUND</p>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
