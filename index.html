<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 font-sans text-gray-800 min-h-screen flex flex-col items-center p-4">

    <header class="w-full max-w-5xl mb-8 animate-fade-in-down">
        <div class="bg-blue-600 text-white p-6 rounded-lg shadow-lg text-center">
            <h1 class="text-3xl font-bold"><i class="fas fa-user-graduate mr-2"></i>Student Management System</h1>
            <p class="text-blue-100 mt-2">Manage your records efficiently</p>
        </div>
    </header>

    <main class="w-full max-w-5xl flex flex-col md:flex-row gap-6">
        
        <section class="w-full md:w-1/3 bg-white p-6 rounded-lg shadow-md h-fit animate-slide-in-left">
            <h2 class="text-xl font-bold mb-4 text-gray-700 border-b pb-2">
                <i class="fas fa-edit mr-2"></i>Student Details
            </h2>
            
            <form id="studentForm" class="flex flex-col gap-4">
                <input type="hidden" id="editIndex" value="-1">

                <div>
                    <label class="block text-sm font-semibold text-gray-600 mb-1">Student Name</label>
                    <input type="text" id="name" class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500 transition" placeholder="John Doe">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-600 mb-1">Student ID</label>
                    <input type="number" id="studentId" class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500 transition" placeholder="101">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-600 mb-1">Email Address</label>
                    <input type="email" id="email" class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500 transition" placeholder="john@example.com">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-600 mb-1">Contact No.</label>
                    <input type="number" id="contact" class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500 transition" placeholder="9876543210">
                    <p class="text-xs text-gray-400 mt-1">Must be exactly 10 digits</p>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-600 mb-1">Course</label>
                    <select id="course" class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500 transition bg-white">
                        <option value="">Select Course</option>
                        <option value="Computer Science">Computer Science</option>
                        <option value="Mechanical Eng">Mechanical Eng</option>
                        <option value="Business">Business</option>
                        <option value="Arts">Arts</option>
                    </select>
                </div>

                <button type="submit" id="submitBtn" class="bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-4 rounded transition duration-300 transform hover:scale-105 flex justify-center items-center gap-2 mt-2">
                    <i class="fas fa-plus-circle"></i> <span>Add Student</span>
                </button>
            </form>
        </section>

        <section class="w-full md:w-2/3 bg-white p-6 rounded-lg shadow-md animate-slide-in-right flex flex-col">
            <h2 class="text-xl font-bold mb-4 text-gray-700 border-b pb-2 flex justify-between items-center">
                <span><i class="fas fa-table mr-2"></i>Student List</span>
                <span id="totalCount" class="text-sm bg-blue-100 text-blue-800 py-1 px-3 rounded-full">Total: 0</span>
            </h2>

            <div class="overflow-x-auto overflow-y-auto max-h-[400px] custom-scrollbar rounded border border-gray-200">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-gray-100 sticky top-0 z-10 shadow-sm">
                        <tr>
                            <th class="p-3 text-sm font-bold text-gray-600">Name</th>
                            <th class="p-3 text-sm font-bold text-gray-600">ID</th>
                            <th class="p-3 text-sm font-bold text-gray-600">Contact</th>
                            <th class="p-3 text-sm font-bold text-gray-600">Course</th>
                            <th class="p-3 text-sm font-bold text-gray-600 text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="studentTableBody" class="text-sm divide-y divide-gray-200">
                        </tbody>
                </table>
            </div>
            
            <div id="emptyMsg" class="text-center text-gray-400 mt-10 hidden">
                <i class="fas fa-inbox text-4xl mb-2"></i>
                <p>No students found. Add one to get started!</p>
            </div>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
